---
- name: Install WireGuard tools
  become: true
  ansible.builtin.dnf:
    name:
      - wireguard-tools
    state: present

- name: Enable IPv4 packet forwarding
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Ensure WireGuard configuration directory exists
  become: true
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check for existing WireGuard server private key
  become: true
  ansible.builtin.stat:
    path: /etc/wireguard/private.key
  register: wireguard_private_key_stat
  when: wireguard_server_private_key | length == 0

- name: Generate WireGuard server private key
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && umask 077 && wg genkey > /etc/wireguard/private.key
    executable: /bin/bash
  when:
    - wireguard_server_private_key | length == 0
    - not wireguard_private_key_stat.stat.exists
  changed_when: true

- name: Generate WireGuard server public key
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && wg pubkey < /etc/wireguard/private.key > /etc/wireguard/public.key
    executable: /bin/bash
  args:
    creates: /etc/wireguard/public.key
  when: wireguard_server_private_key | length == 0

- name: Read WireGuard server private key from file
  become: true
  ansible.builtin.slurp:
    src: /etc/wireguard/private.key
  register: wireguard_private_key_slurp
  when: wireguard_server_private_key | length == 0

- name: Set WireGuard active private key fact
  ansible.builtin.set_fact:
    wireguard_active_private_key: >-
      {{
        wireguard_server_private_key
        if (wireguard_server_private_key | length > 0)
        else (wireguard_private_key_slurp.content | b64decode | trim)
      }}
  no_log: true

- name: Configure WireGuard interface
  become: true
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

- name: Allow WireGuard traffic through the firewall
  become: true
  ansible.posix.firewalld:
    port: "{{ wireguard_port }}/udp"
    permanent: true
    state: enabled
    immediate: true

- name: Enable firewall masquerading for VPN clients
  become: true
  ansible.posix.firewalld:
    masquerade: true
    permanent: true
    state: enabled
    immediate: true

- name: Enable and start WireGuard service
  become: true
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
